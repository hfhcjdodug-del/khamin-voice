plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.khamin.voice"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.khamin.voice"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // Fixed key so every build is signed the same way and can update the previous install.
            storeFile = file("guess-release.jks")
            storePassword = "guesspass2026"
            keyAlias = "guess"
            keyPassword = "guesspass2026"
            // توقيع بكل الأنظمة لأقصى توافق مع برامج التثبيت في الهواتف المختلفة
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

// خدمات Firebase (الإشعارات): تُفعَّل فقط إذا وُجد ملف google-services.json داخل android/app
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// نفس رقم الإصدار لنسختي 32 و64 بت، حتى لا يُعدّ الانتقال بينهما «تخفيضاً» فيرفضه الأندرويد.
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = variant.versionCode
    }
}
