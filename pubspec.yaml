publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  livekit_client: ^2.3.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  http: ^1.2.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  google_mobile_ads: ^5.3.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/levels/
    - assets/titles/
    - assets/gifts/
